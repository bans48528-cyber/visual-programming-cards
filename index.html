<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图形化编程原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">A</div>
        <div class="brand-title">图形化编程原型</div>
      </div>
      <div class="toolbar" aria-label="程序操作">
        <span class="toolbar-status" id="status" aria-live="polite">工作区就绪</span>
        <button class="btn" id="undoBtn" type="button" disabled>撤销</button>
        <button class="btn" id="redoBtn" type="button" disabled>前进</button>
        <button class="btn" id="saveBtn" type="button">保存</button>
        <button class="btn" id="loadBtn" type="button">读取</button>
        <button class="btn danger" id="clearBtn" type="button">清空</button>
      </div>
    </header>

    <main class="workspace">
      <section class="program-area" aria-label="程序区">
        <button class="grab-tool" id="grabTool" type="button" aria-label="同时抓取多张卡片">✋</button>
        <button class="eraser-tool" id="eraserTool" type="button" aria-label="橡皮擦批量删除">⌫</button>
        <div class="program-canvas">
          <div class="chain sequence-zone" id="chain" data-sequence-path="">
            <div class="block start" id="startBlock" role="listitem" aria-label="程序开始">开始</div>
            <div class="empty-note" id="emptyNote">放入卡片</div>
          </div>
        </div>
      </section>

      <section class="library-area" aria-label="卡片库">
        <div class="tabs" role="tablist" aria-label="卡片分类">
          <button class="tab" id="tab-action" role="tab" type="button" aria-selected="true" style="--tab-color: var(--action)">选项卡A</button>
          <button class="tab" id="tab-look" role="tab" type="button" aria-selected="false" style="--tab-color: var(--look)">选项卡B</button>
          <button class="tab" id="tab-sound" role="tab" type="button" aria-selected="false" style="--tab-color: var(--sound)">选项卡C</button>
          <button class="tab" id="tab-control" role="tab" type="button" aria-selected="false" style="--tab-color: var(--control)">选项卡D</button>
        </div>
        <div class="palette" id="palette" aria-live="polite"></div>
        <div class="delete-overlay" id="deleteOverlay" aria-hidden="true">在此松手进行删除</div>
      </section>
    </main>
  </div>
  <div class="rotate-note">请将手机横屏使用</div>
  <div class="erase-confirm" id="eraseConfirm" hidden role="dialog" aria-modal="false" aria-labelledby="eraseConfirmText">
    <p class="erase-confirm-text" id="eraseConfirmText">是否删除标记卡片？</p>
    <div class="erase-confirm-actions">
      <button class="btn" id="eraseCancelBtn" type="button">取消</button>
      <button class="btn danger" id="eraseOkBtn" type="button">确定</button>
    </div>
  </div>
  <div class="param-popover" id="paramEditor" hidden aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
